# Reusable dependency gate. Caller: pull_request (NOT pull_request_target), no path filter.
# Workflow: Dematom1/oss-workflows/.github/workflows/dependency-verify.yml@<SHA>
# Preset: github>Dematom1/oss-workflows//renovate/axi#<SHA> (.json is appended).
# Pin both references to the same immutable shared-host SHA.
# Require the caller workflow's success on the current PR SHA in the no-mistakes
# gate; no exemption based only on an author/check name. No ruleset/bypass changes.
# Caller commands are supplied by the reviewed caller workflow; PR metadata never supplies commands.
# Scope rejects workflow changes. Commands run only in read-only, credential-free pull_request jobs.
# install/build/test/smoke are required; smoke MUST use real binaries read-only.
# axi-verify-command is optional only until axi-verify ships (visible placeholder).
# provenance-command defaults to npm audit signatures. Registry metadata is compared
# across old/new versions: provenance downgrades and unknown metadata fail; packages
# without previous provenance produce named warnings. Invalid signatures fail.
# ecosystem defaults to npm; go uses root go.mod/go.sum, public proxy/checksums,
# go mod verify and source-mode govulncheck. Go bisect is not supported.
# lockfile-path defaults to package-lock.json (relative to repository root; npm only).
# The built-in diff/bisect adapter supports npm lockfile v3, including added and removed paths.
# For another package manager supply diagnostic-command: it receives BASE_REF,
# HEAD_REF, LOCKFILE, FAILED_STEP, COMMANDS (JSON), MAX_ROUNDS, TIMEOUT_MINUTES,
# REPORT_DIR; it must write report.json {message,culprits,rounds}. The reporter
# independently validates culprit names and never renders artifact message fields.
# Diagnostic commands must bound their own trials; the job also has a hard timeout.
# The weekly batch branch is renovate/weekly-non-major (shared preset groupSlug);
# other dependency PRs get all checks/diffs but are never automatically split.
# npm trials restore package entries/specs from the base lock; installation or
# earlier-step failures are inconclusive, never evidence against a package.
# A reproduced failure, passing base, isolated failures and a passing reduced
# batch produce diagnosis only. Interactions, unsupported locks and limits fail closed.
# Automatic splitting is deferred until its dedicated App is provisioned; diagnosis
# never changes the PR or substitutes for successful verification.
# Required caller permissions: contents: read, pull-requests: write. shared-script-ref
# is the immutable 40-hex shared-repository SHA used for this workflow and preset.
name: Dependency verification

on:
  workflow_call:
    inputs:
      shared-script-ref:
        type: string
        required: true
      ecosystem:
        type: string
        default: npm
      install-command:
        type: string
        required: true
      build-command:
        type: string
        required: true
      test-command:
        type: string
        required: true
      smoke-command:
        type: string
        required: true
      axi-verify-command:
        type: string
        default: ""
      provenance-command:
        type: string
        default: npm audit signatures
      diagnostic-command:
        type: string
        default: ""
      lockfile-path:
        type: string
        default: package-lock.json
      node-version:
        type: string
        default: "22"
      bisect-max-rounds:
        type: number
        default: 8
      bisect-timeout-minutes:
        type: number
        default: 20

permissions:
  contents: read

concurrency:
  group: dependency-verify-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
      failed-step: >-
        ${{ steps.install.outcome == 'failure' && 'install' ||
            steps.provenance.outcome == 'failure' && 'provenance' ||
            steps.go-provenance.outcome == 'failure' && 'provenance' ||
            steps.build.outcome == 'failure' && 'build' ||
            steps.test.outcome == 'failure' && 'test' ||
            steps.axi.outcome == 'failure' && 'axi' ||
            steps.smoke.outcome == 'failure' && 'smoke' || '' }}
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.sha }}
      LOCKFILE: ${{ inputs.lockfile-path }}
      COMMANDS: ${{ toJSON(inputs) }}
      ECOSYSTEM: ${{ inputs.ecosystem }}
    steps:
      - name: Validate immutable shared script ref
        env:
          SHARED_SCRIPT_REF: ${{ inputs.shared-script-ref }}
        run: '[[ "$SHARED_SCRIPT_REF" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Dematom1/oss-workflows
          ref: ${{ inputs.shared-script-ref }}
          path: _shared
          persist-credentials: false
      - name: Enforce Renovate identity and dependency-only scope
        id: scope
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SHARED_TOOL_DIR: ${{ github.workspace }}/_shared/scripts
          MAX_ROUNDS: ${{ inputs.bisect-max-rounds }}
          TIMEOUT_MINUTES: ${{ inputs.bisect-timeout-minutes }}
        with:
          script: |
            await require(process.env.SHARED_TOOL_DIR + '/dependency-scope.cjs')({context, github, core, process});
      - name: Copy trusted engine before caller checkout
        run: mkdir -p "$RUNNER_TEMP/shared-scripts" && cp _shared/scripts/dependency-engine.cjs _shared/scripts/dependency-provenance.cjs _shared/scripts/dependency-go.cjs "$RUNNER_TEMP/shared-scripts/"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        if: ${{ inputs.ecosystem == 'go' }}
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare shared diagnostic scripts
        shell: bash
        run: |
          echo "REPORT_DIR=$RUNNER_TEMP/dependency-report" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dependency-report"
      - name: Dependency diff (diagnostic failure remains visible)
        continue-on-error: true
        run: |
          if [ "$ECOSYSTEM" = go ]; then
            node "$RUNNER_TEMP/shared-scripts/dependency-go.cjs" diff
          else
            node "$RUNNER_TEMP/shared-scripts/dependency-engine.cjs" diff
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-diff
          path: ${{ runner.temp }}/dependency-report/diff.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify Go proxy checksums, cache integrity and reachable vulnerabilities
        id: go-provenance
        if: ${{ inputs.ecosystem == 'go' }}
        run: node "$RUNNER_TEMP/shared-scripts/dependency-go.cjs" verify
      - name: Install
        id: install
        env:
          COMMAND: ${{ inputs.install-command }}
        run: bash -e -o pipefail -c "$COMMAND"
      - name: Verify registry provenance policy and npm signatures
        id: provenance
        if: ${{ success() && inputs.ecosystem == 'npm' }}
        env:
          PROVENANCE_COMMAND: ${{ inputs.provenance-command }}
        run: node "$RUNNER_TEMP/shared-scripts/dependency-provenance.cjs"
      - name: Build
        id: build
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -e -o pipefail -c "$COMMAND"
      - name: Full tests
        id: test
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -e -o pipefail -c "$COMMAND"
      - name: axi-verify placeholder — not yet shipped; no axi-verify coverage claimed
        if: ${{ inputs.axi-verify-command == '' }}
        run: echo 'axi-verify is not yet shipped. Placeholder only; no axi-verify coverage claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: axi-verify
        id: axi
        if: ${{ success() && inputs.axi-verify-command != '' }}
        env:
          COMMAND: ${{ inputs.axi-verify-command }}
        run: bash -e -o pipefail -c "$COMMAND"
      - name: Read-only real-binary smoke
        id: smoke
        env:
          COMMAND: ${{ inputs.smoke-command }}
        run: bash -e -o pipefail -c "$COMMAND"

  bisect:
    needs: verify
    if: ${{ failure() && inputs.ecosystem == 'npm' && needs.verify.outputs.eligible == 'true' && needs.verify.outputs.failed-step != '' && github.event.pull_request.head.ref == 'renovate/weekly-non-major' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.bisect-timeout-minutes }}
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.sha }}
      LOCKFILE: ${{ inputs.lockfile-path }}
      FAILED_STEP: ${{ needs.verify.outputs.failed-step }}
      COMMANDS: ${{ toJSON(inputs) }}
      PROVENANCE_COMMAND: ${{ inputs.provenance-command }}
      MAX_ROUNDS: ${{ inputs.bisect-max-rounds }}
      TIMEOUT_MINUTES: ${{ inputs.bisect-timeout-minutes }}
      DIAGNOSTIC_COMMAND: ${{ inputs.diagnostic-command }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Dematom1/oss-workflows
          ref: ${{ inputs.shared-script-ref }}
          path: _shared
          persist-credentials: false
      - name: Copy trusted diagnostic script
        run: mkdir -p "$RUNNER_TEMP/shared-scripts" && cp _shared/scripts/dependency-engine.cjs _shared/scripts/dependency-provenance.cjs "$RUNNER_TEMP/shared-scripts/"
      - name: Bounded dependency bisect
        run: |
          export REPORT_DIR="$RUNNER_TEMP/dependency-bisect"
          mkdir -p "$REPORT_DIR"
          if [ -n "$DIAGNOSTIC_COMMAND" ]; then
            timeout "${TIMEOUT_MINUTES}m" bash -e -o pipefail -c "$DIAGNOSTIC_COMMAND"
          else
            node "$RUNNER_TEMP/shared-scripts/dependency-engine.cjs" bisect
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: dependency-bisect
          path: ${{ runner.temp }}/dependency-bisect/report.json
          if-no-files-found: warn
          retention-days: 7

  report:
    needs: [verify, bisect]
    if: ${{ always() && needs.verify.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Dematom1/oss-workflows
          ref: ${{ inputs.shared-script-ref }}
          path: _shared
          persist-credentials: false
      # No checkout of caller source, npm or dependency code in this reporting job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dependency-*
          path: ${{ runner.temp }}/dependency-artifacts
      - name: Comment results and split isolated packages
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ECOSYSTEM: ${{ inputs.ecosystem }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BISECT_RESULT: ${{ needs.bisect.result }}
          LOCKFILE: ${{ inputs.lockfile-path }}
          ARTIFACTS: ${{ runner.temp }}/dependency-artifacts
        with:
          script: |
            await require(process.cwd() + '/_shared/scripts/dependency-report.cjs')({context, github, core, process, require});
